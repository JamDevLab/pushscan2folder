# Example configuration for pushscan2folder.
#
# Where this file lives: ~/.config/pushscan2folder/config.toml on Linux,
# %APPDATA%\pushscan2folder\config.toml on Windows, or the path in
# --config / PUSHSCAN_CONFIG. In Docker: ./config/config.toml.
# Every key is optional. Changes are used while the program runs.
#
# The printer panel decides the colour (the start button you press), the
# source (the document feeder when paper is in it, else the glass) and, for
# the document types "Document" and "Photo", size, format and resolution.
# This file sets the rest: folders, file names, the "next page" dialog and
# the settings for document type "Auto".

printer = "192.168.1.50"                 # printer IP address or host name
folder = "/scans"                        # base folder of all targets

# Defaults for all targets
# File name without extension. Fields: {name} (panel name), {date}
# (2026-11-22), {time} (183005), {now:...} with %Y %m %d %H %M %S.
# Existing files are never overwritten (-1, -2 ... is added).
filename = "scan_{now:%Y-%m-%d_%H-%M-%S}"
# Document types that get the "next page" dialog for scans on the glass:
# "document", "auto", "photo". The feeder scans all pages in one go.
next_page = ["document"]
# Optional: the same dialog after a scan from the document feeder, to check
# the page count (the feeder sometimes pulls two sheets). Adds about 10 s per
# round. Off by default.
# feeder_next_page = ["document"]
# Document type "Auto": the panel sends no settings, these are used.
# resolution 75 | 150 | 300 | 600, format "pdf" | "jpeg",
# size "a4" | "letter" | "legal" | "10x15" | "13x18"
auto = { resolution = 300, format = "pdf", size = "a4" }
open_after_scan = false                  # desktop PC only: show the new file

# Rarely needed.
[advanced]
interval = 4                             # seconds between polls
verbose = false                          # debug log, needs a restart
# Cut off a border by scanning a smaller area, mm per side (0 to 50).
trim = { right = 1, bottom = 2 }         # glass; tested on a TR8550
adf_trim = { }                           # document feeder

# Optional web page (status, log, target and settings editor). The password
# is not stored here: `pushscan2folder setup` writes it to a file of its own.
# [web]
# enabled = true
# bind = "127.0.0.1"                     # this PC only; 0.0.0.0 = the network
# port = 8737
# password_file = "web_password.txt"     # relative to this file

# One [[target]] per entry on the printer panel (name: max 31 characters).
# folder is relative to the base folder unless absolute; without it the
# folder is named after the target.

[[target]]
name = "Scans"                           # scans go to /scans/Scans

[[target]]
name = "Paperless"                       # mount the paperless-ngx consume folder here
next_page = ["document", "auto"]         # also ask for more pages with "Auto"
photo_folder = "Photos"                  # photos of this entry go to /scans/Photos

[[target]]
name = "Archive"
folder = "Archive/{now:%Y}"              # one folder per year
next_page = []                           # never ask for more pages
feeder_next_page = ["document"]          # but check the page count after the feeder
auto = { resolution = 600, format = "jpeg" }
