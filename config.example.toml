# Example configuration for pushscan2folder.
#
# Default location: ~/.config/pushscan2folder/config.toml
# (or $XDG_CONFIG_HOME/pushscan2folder/config.toml; on Windows
# %APPDATA%\pushscan2folder\config.toml), or pass --config PATH /
# set PUSHSCAN_CONFIG. Precedence: command line > PUSHSCAN_* env vars > this file >
# built-in defaults. Every key is optional.
# Docker (docker-compose.yml): this file is ./config/config.toml, and
# PUSHSCAN_PRINTER from the compose file wins over "printer" below.

printer = "192.168.1.50"   # printer IP or host name (--printer)
output = "/scans"          # base output folder (--output)

# Scan settings used where the printer panel sends nothing.
[defaults]
resolution = 300           # 75 | 150 | 300 | 600
color = "color"            # color | gray
format = "pdf"             # pdf | jpeg
source = "auto"            # auto | platen | adf
size = "a4"                # a4 | letter | legal | 10x15 | 13x18
open_after_scan = "off"    # off | folder | file (desktop PC only: open the result)
# File name of a scan without extension (--filename / PUSHSCAN_FILENAME).
# Fields: {name} (panel name), {date} (2026-11-22), {time} (183005) and
# {now:FORMAT} with strftime codes. Existing files are never overwritten (-1, -2 ...).
# A [[target]] can set its own filename, it wins over this one.
filename = "scan_{now:%Y%m%d_%H%M%S}"   # e.g. scan_20261122_183005.pdf

# Document type "Document" on the printer panel (Doc. type).
[defaults.document]
multipage = true           # ask on the panel for more pages after each one

# Document type "Auto" on the printer panel. The panel sends no size, format
# or resolution then, so [defaults] and [target.auto] decide. ("Photo" needs
# no table: the panel sends all of its settings itself.)
[defaults.auto]
multipage = false

# Rarely needed.
[advanced]
interval = 4               # poll interval in seconds
verbose = false            # debug log; needs a restart
ignore_panel = false       # true: always use [defaults], ignore the panel
# Trim: cut off a border at the glass edge by scanning a smaller area
# (platen only, not the ADF). In mm, 0 to 50; 0 means no trim.
trim_left = 0              # mm
trim_top = 0               # mm
trim_right = 1             # mm; tested on a TR8550
trim_bottom = 2            # mm; tested on a TR8550

# Optional web page (status, log, target editor). The password is NOT stored
# here: put it in a file of its own (`pushscan2folder setup` does this) and
# name the file. The web page shows this table but cannot change it.
# Precedence: --web / --web-port / --web-bind and PUSHSCAN_WEB* win over it.
# [web]
# enabled = true
# bind = "127.0.0.1"         # only this PC; 0.0.0.0 = reachable from the network
# port = 8080
# password_file = "web_password.txt"   # relative to this config file

# One [[target]] per entry on the printer panel (name: max 31 chars, unique).

# All defaults: scans go to /scans/Scans
[[target]]
name = "Scans"

# Folder /scans/Paperless (for paperless-ngx, mount its consume folder
# there), multi-page dialog for document type "Document", and a preset for
# "Auto scan" (the preset wins over the panel there).
[[target]]
name = "Paperless"
# filename = "{name}_{date}_{time}"   # this target only, e.g. Paperless_2026-11-22_183005.pdf
open_after_scan = "off"   # this target only: never open after a scan (off | folder | file)

[target.document]
multipage = true

[target.auto]
resolution = 300
format = "pdf"
multipage = true           # dialog for auto scan too

# Relative output is resolved against the base output (/scans/archive).
[[target]]
name = "Archive"
output = "archive"

[target.document]
multipage = false

[target.auto]
resolution = 600
format = "jpeg"
