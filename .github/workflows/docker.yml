name: docker

# Builds the Docker image for amd64 and arm64. On a version tag it is pushed
# to the GitHub Container Registry as ghcr.io/jamdevlab/pushscan2folder with
# the tags VERSION, MAJOR.MINOR and latest. Pushes to other branches than main
# and manual runs only build it (a check that the Dockerfile still works).
on:
  push:
    tags: ["v*"]
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jamdevlab/pushscan2folder

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(PYTHONPATH=src python3 -c "import pushscan2folder; print(pushscan2folder.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in src/pushscan2folder/__init__.py"
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
      - name: Log in to the GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on a tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test
        run: |
          docker build -t pushscan2folder:test .
          docker run --rm pushscan2folder:test --version
          # no printer contact yet: the healthcheck must report unhealthy (exit 1)
          set +e; docker run --rm pushscan2folder:test health; code=$?; set -e
          test "$code" -eq 1
          docker inspect --format '{{json .Config.Healthcheck}}' pushscan2folder:test
