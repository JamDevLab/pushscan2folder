name: Does it work with my printer?
description: Report which features work with your printer model.
labels: ["printer-report"]
body:
  - type: input
    id: printer
    attributes:
      label: Printer model
      placeholder: Canon PIXMA ...
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Printer firmware version
      description: Only if you know it.
  - type: checkboxes
    id: works
    attributes:
      label: What works?
      options:
        - label: The name shows up on the printer panel (registration)
        - label: Single page scan from the glass
        - label: Scan from the ADF
        - label: Multi-page scan from the glass (next-page dialog)
        - label: The panel settings are used (resolution, format, size, colour)
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything that failed or looked odd. Verbose log lines help (`--verbose`); remove IP addresses and names if you want.
