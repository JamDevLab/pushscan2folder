# Dependabot opens pull requests when a GitHub Action or the Python base image
# of the Dockerfile has a newer version. Both are pinned by commit SHA or
# image digest (with the version in a comment), so a moved tag cannot change
# what CI runs; Dependabot updates the SHA, the digest and the comment.
# PyInstaller (version and sdist SHA-256) and Inno Setup are pinned in
# release.yml and are updated by hand. Pillow (requirements.txt) is watched too.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
